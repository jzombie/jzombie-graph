[package]
name = "jzombie-graph"
version = "0.1.0"
edition = "2024"
publish = false
description = "Visibility-flagged portfolio graph collector: GitHub user/org -> node/edge JSON"
license = "MIT OR Apache-2.0"

[[bin]]
name = "jzombie-graph"
path = "src/main.rs"

[lib]
name = "jzombie_graph"
path = "src/lib.rs"

[workspace]
members = [".", "crates/cartographer", "crates/charts"]

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
insta = { version = "1", features = ["json"] }
oxdock = "=0.38.0-alpha"
oxdock-core = "=0.38.0-alpha"
oxdock-markdown-plugin = "=0.38.0-alpha"
regex = "1"
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
reqwest-drive = "0.13.5-alpha.1"
reqwest-middleware = { version = "0.5", features = ["json"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }
tempfile = "3"
toml = { version = "0.8", features = ["parse", "display"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-drive.workspace = true
reqwest-middleware.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
syn.workspace = true
toml.workspace = true
tokio.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
