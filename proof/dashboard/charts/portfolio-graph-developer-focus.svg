<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480.0 502.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Developer focus</title><text x="16" y="30" font-size="20" fill="#767676">Developer focus</text><style>
