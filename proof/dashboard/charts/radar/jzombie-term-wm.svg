<svg xmlns="http://www.w3.org/2000/svg" width="156.1" height="136.0" viewBox="0 0 156.1 136.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Radar chart of percentiles among my active repos: Commits 30d 66th percentile, Issue traffic 91st percentile, Pull requests 63rd percentile, Reuse 75th percentile, Stars 72nd percentile, Focus 47th percentile</title><style>
            .bar {
                stroke: #fff;
                stroke-width: 2;
                rx: 4;
            }
            .lbl {
                fill: #fff;
                font-size: 13px;
                font-weight: 600;
            }
            .sub {
                fill: #fff;
                font-size: 11px;
                opacity: .92;
            }
            .dim {
                fill: #333;
                font-size: 12px;
            }
            .wht {
                fill: #fff;
                font-size: 10px;
                paint-order: stroke;
                stroke: rgba(0, 0, 0, .45);
                stroke-width: 3px;
                stroke-linejoin: round;
            }
            .muted {
                fill: #666;
                font-size: 11px;
            }
            .pulse {
                animation: breathe 2.2s ease-in-out infinite;
            }
            .slow {
                animation-duration: 3.4s;
            }
            @keyframes breathe {
                0%, 100% { opacity: .95; }
                50% { opacity: .62; }
            }
            .halo {
                transform-box: fill-box;
                transform-origin: center;
                animation: halo 2.2s ease-out infinite;
            }
            @keyframes halo {
                0% { opacity: .75; transform: scale(1); }
                100% { opacity: 0; transform: scale(2.4); }
            }
            .card {
                opacity: 0;
                animation: whisk ease-in-out infinite;
                animation-iteration-count: infinite;
            }
            .deck .card#r0 {
                opacity: 1;
            }
            @keyframes whisk {
                0% { opacity: 0; transform: translateX(60px); }
                3% { opacity: 1; transform: translateX(0); }
                10% { opacity: 1; transform: translateX(0); }
                13% { opacity: 0; transform: translateX(-60px); }
                100% { opacity: 0; transform: translateX(-60px); }
            }
            @media (prefers-reduced-motion: reduce) {
                .pulse, .halo, .card { animation: none; }
            }
        </style><circle cx="70.6" cy="74.0" r="10.5" fill="none" stroke="#767676" stroke-width="1" opacity="0.4"/><circle cx="70.6" cy="74.0" r="21.0" fill="none" stroke="#767676" stroke-width="1" opacity="0.4"/><circle cx="70.6" cy="74.0" r="31.5" fill="none" stroke="#767676" stroke-width="1" opacity="0.4"/><circle cx="70.6" cy="74.0" r="42.0" fill="none" stroke="#767676" stroke-width="1" opacity="0.7"/><line x1="70.6" y1="74.0" x2="70.6" y2="32.0" stroke="#767676" stroke-width="1" opacity="0.5"/><line x1="70.6" y1="74.0" x2="106.9" y2="53.0" stroke="#767676" stroke-width="1" opacity="0.5"/><line x1="70.6" y1="74.0" x2="106.9" y2="95.0" stroke="#767676" stroke-width="1" opacity="0.5"/><line x1="70.6" y1="74.0" x2="70.6" y2="116.0" stroke="#767676" stroke-width="1" opacity="0.5"/><line x1="70.6" y1="74.0" x2="34.2" y2="95.0" stroke="#767676" stroke-width="1" opacity="0.5"/><line x1="70.6" y1="74.0" x2="34.2" y2="53.0" stroke="#767676" stroke-width="1" opacity="0.5"/><polygon points="70.6,46.4 103.5,55.0 93.3,87.1 70.6,105.5 44.4,89.1 53.5,64.2" fill="#56B4E9" fill-opacity="0.32" stroke="#56B4E9" stroke-width="2" stroke-linejoin="round" class=""/><circle cx="70.6" cy="46.4" r="2.5" fill="#56B4E9"/><circle cx="103.5" cy="55.0" r="2.5" fill="#56B4E9"/><circle cx="93.3" cy="87.1" r="2.5" fill="#56B4E9"/><circle cx="70.6" cy="105.5" r="2.5" fill="#56B4E9"/><circle cx="44.4" cy="89.1" r="2.5" fill="#56B4E9"/><circle cx="53.5" cy="64.2" r="2.5" fill="#56B4E9"/><text x="70.6" y="11.5" text-anchor="middle" font-size="10.0" fill="#767676">Commits</text><text x="70.6" y="23.5" text-anchor="middle" font-size="10.0" fill="#767676">30d</text><text x="112.1" y="47.5" text-anchor="start" font-size="10.0" fill="#767676">Issue</text><text x="112.1" y="59.5" text-anchor="start" font-size="10.0" fill="#767676">traffic</text><text x="112.1" y="95.5" text-anchor="start" font-size="10.0" fill="#767676">Pull</text><text x="112.1" y="107.5" text-anchor="start" font-size="10.0" fill="#767676