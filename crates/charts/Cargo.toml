[package]
name = "jzombie-graph-charts"
version = "0.1.0"
edition = "2024"
publish = false
description = "Chart renderers for jzombie-graph JSON (OxDock-templated SVG)"

[[bin]]
name = "charts"
path = "src/main.rs"

[lib]
name = "charts"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
jzombie-graph = { path = "../.." }
oxdock.workspace = true
oxdock-core.workspace = true
oxdock-markdown-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
