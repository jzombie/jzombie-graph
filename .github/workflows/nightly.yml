name: nightly
on:
  schedule:
    # Daily, offset off the top of the hour (cron posture: never :00).
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  # Nightly commits the rebuilt proof. Nothing publishes:
  # no Pages, no deploy steps — the committed preview/ files plus the
  # generated schema copy are the channel.
  contents: write
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      JZOMBIE_GRAPH_TOKEN: ${{ secrets.JZOMBIE_GRAPH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Warm-cache rebuilds: same checked-in source, seconds instead of
      # minutes. Cache-only — no extra workflows, permissions, or binaries.
      - uses: Swatinem/rust-cache@v2
      # OxDock owns the pipeline (build → collect → schema → render) via
      # .github/scripts/pipeline.oxfile. Setup tracks latest (action @main,
      # engine `latest` by default) — we own both ends, and a bad oxdock
      # release fails closed (no commit, last good preview keeps serving).
      # Note: this `uses:` token points in-portfolio, so the sweep records
      # a Workflow-kind edge (JSON-only, never drawn — associations don't
      # render). Dogfooding, working as designed.
      - uses: jzombie/rust-oxdock/.github/actions/setup-oxdock@main
      # The proof page assembles via oxdock-render (see lanes RENDER),
      # so the renderer rides alongside the engine.
      - uses: jzombie/rust-oxdock/.github/actions/setup-oxdock-render@feat/render-action
      # The PAT bridges into the script via INHERIT_ENV (see pipeline.oxfile).
      # The script owns collect → render → commit; Actions owns trigger.
      - run: oxdock .github/scripts/pipeline.oxfile
