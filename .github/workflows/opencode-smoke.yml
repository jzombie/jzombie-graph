name: opencode-smoke
on:
  push:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OxDock engine owns the smoke logic (IS_EXEC probe → install → run).
      # Unified action on the default branch (stub fetch authenticated).
      # Defaults: product oxdock, version latest.
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock
      - run: oxdock .github/scripts/opencode-smoke.oxfile
        env:
          # Optional: with a provider key the final `opencode run` executes
          # and the model reply echoes to the log. Without it the smoke
          # proves install + executable, skips the model call (anonymous
          # free-model quota is IP-scoped and unreliable from runners),
          # and exits green.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
