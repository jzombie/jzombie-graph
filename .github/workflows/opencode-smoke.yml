name: opencode-smoke
on:
  push:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Authenticated engine install (replaces setup-oxdock@main: its
      # anonymous raw.githubusercontent fetch 403s from shared runner
      # IPs). Tracks latest; GITHUB_TOKEN authenticates every fetch the
      # stub makes, and the payload self-verifies against SHA256SUMS.
      - name: Install OxDock engine (latest)
        shell: bash
        env:
          VERSION: latest
          INSTALL_DIR: ${{ runner.temp }}/oxdock-engine
          OXDOCK_PRODUCT: oxdock
          OXDOCK_BINARY_NAME: oxdock
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.sh | bash
      - run: oxdock .github/scripts/opencode-smoke.oxfile
        env:
          # Optional: without a provider key the final `opencode run`
          # fails closed with the provider auth error (still proves
          # IS_EXEC + install + executable). With the secret set, the
          # model reply echoes to the log.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
