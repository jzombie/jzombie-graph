name: opencode-smoke
on:
  push:
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OxDock engine owns the smoke logic (IS_EXEC probe → install → run).
      # Tracks the 301 stub-auth branch until it lands (anonymous stub
      # fetch 403s from shared runner IPs); then pin to a SHA.
      - uses: jzombie/rust-oxdock/.github/actions/setup-oxdock@301-setup-oxdock-render-authenticate-stub-fetch-anonymous-rawgithubusercontent-403s-from-shared-runner-ips
      - run: oxdock .github/scripts/opencode-smoke.oxfile
        env:
          # Optional: with a provider key the final `opencode run` executes
          # and the model reply echoes to the log. Without it the smoke
          # proves install + executable, skips the model call (anonymous
          # free-model quota is IP-scoped and unreliable from runners),
          # and exits green.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
