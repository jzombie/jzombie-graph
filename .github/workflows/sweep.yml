name: sweep
on:
  schedule:
    - cron: "0 6 * * *" # nightly, UTC
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      JZOMBIE_GRAPH_TOKEN: ${{ secrets.JZOMBIE_GRAPH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -- --config values.toml --format json --output graph.json
      - uses: actions/upload-artifact@v4
        with:
          name: graph-${{ github.run_id }}
          path: graph.json
          retention-days: 30
