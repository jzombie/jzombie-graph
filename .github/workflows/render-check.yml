name: render-check
on:
  push:
  pull_request:
  workflow_dispatch: {}
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The proof page is renderer-owned: one command assembles it from
      # the committed fragments, then the drift gate fires on any
      # hand-edit. Input freshness (fragment + chart lanes) rides the
      # renderer's pre-hook once hook support lands.
      - uses: jzombie/rust-oxdock/.github/actions/setup-oxdock-render@feat/render-action
      - run: oxdock-render
      - run: git diff --exit-code -- proof/ data/
