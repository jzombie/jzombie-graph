name: ci
on:
  push:
  pull_request:
  workflow_dispatch: {}
# Ensure only one run per branch or PR at a time. If new commits are
# pushed, older jobs cancel automatically.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # OxDock owns the check sequence via an inline script (no .oxfile
      # file to keep in sync for three lines). Unified action on the
      # default branch (stub fetch authenticated).
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock
      # Workspace-wide: plain `cargo test`/`clippy` at the root package skip
      # crates/cartographer's render suite and the snapshot contract.
      - shell: oxdock --script {0}
        run: |
          WORKSPACE LOCAL
          RUN ["cargo", "fmt", "--all", "--check"]
          RUN ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
          RUN ["cargo", "test", "--workspace"]
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Warm-cache rebuilds: same checked-in source, seconds instead of
      # minutes. Cache-only — no extra workflows, permissions, or binaries.
      - uses: Swatinem/rust-cache@v2
      # The proof page is renderer-owned: VERIFY_PROOF rebuilds the
      # inputs, assembles via the renderer, then the drift gate
      # (GATE_PROOF_DRIFT: git diff --exit-code -- proof/ data/) fires
      # on any hand-edit or stale artifact. Tokenless: renders whatever
      # data/ holds, never collects.
      # Engine + renderer installs: unified action on the default branch.
      # (The old @feat/render-action ref never existed.)
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock
      - uses: jzombie/rust-oxdock@main
        with:
          product: oxdock-render
      - run: oxdock .github/scripts/render-check.oxfile
