# values.toml — live sweep config for jzombie's portfolio.
# Committed: no secrets here (token comes from JZOMBIE_GRAPH_TOKEN env).
# Regenerate the [aliases] table with: python3 /tmp/alias_scan.py
# plus member crates (see README "Alias table").

[source]
user = "jzombie"
include_forks = true

[collection]
window_days = 30

[aliases]
