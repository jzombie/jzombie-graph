<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444.0 256.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Trailing-5d commit share</title><text x="16" y="30" font-size="20" fill="#767676">Trailing-5d commit share</text><style>
            .bar {
                stroke: #fff;
                stroke-width: 2;
                rx: 4;
            }
            .lbl {
                fill: #fff;
                font-size: 13px;
                font-weight: 600;
            }
            .sub {
                fill: #fff;
                font-size: 11px;
                opacity: .92;
            }
            .dim {
                fill: #333;
                font-size: 12px;
            }
            .wht {
                fill: #fff;
                font-size: 10px;
                paint-order: stroke;
                stroke: rgba(0, 0, 0, .45);
                stroke-width: 3px;
                stroke-linejoin: round;
            }
            .muted {
                fill: #666;
                font-size: 11px;
            }
            .pulse {
                animation: breathe 2.2s ease-in-out infinite;
            }
            .slow {
                animation-duration: 3.4s;
            }
            @keyframes breathe {
                0%, 100% { opacity: .95; }
                50% { opacity: .62; }
            }
            .halo {
                transform-box: fill-box;
                transform-origin: center;
                animation: halo 2.2s ease-out infinite;
            }
            @keyframes halo {
                0% { opacity: .75; transform: scale(1); }
                100% { opacity: 0; transform: scale(2.4); }
            }
            .card {
                opacity: 0;
                animation: whisk ease-in-out infinite;
                animation-iteration-count: infinite;
            }
            .deck .card#r0 {
                opacity: 1;
            }
            @keyframes whisk {
                0% { opacity: 0; transform: translateX(60px); }
                3% { opacity: 1; transform: translateX(0); }
                10% { opacity: 1; transform: translateX(0); }
                13% { opacity: 0; transform: translateX(-60px); }
                100% { opacity: 0; transform: translateX(-60px); }
            }
            @media (prefers-reduced-motion: reduce) {
                .pulse, .halo, .card { animation: none; }
            }
        </style><path d="M 106.0,150.0 L 106.0,60.0 A 90.0,90.0 0 1,1 47.7,81.4 Z" fill="#56B4E9" class="pulse"><title>jzombie-graph 88.8%</title></path><rect x="224.0" y="116.0" width="14" height="14" fill="#56B4E9"/><text x="246.0" y="129.0" font-size="14" fill="#767676">jzombie-graph 88.8%</text><path d="M 106.0,150.0 L 47.7,81.4 A 90.0,90.0 0 0,1 74.9,65.5 Z" fill="#E69F00" class="pulse"><title>rust-argtuner 5.6%</title></path><rect x="224.0" y="142.0" width="14" height="14" fill="#E69F00"/><text x="246.0" y="155.0" font-size="14" fill="#767676">rust-argtuner 5.6%</text><path d="M 106.0,150.0 L 74.9,65.5 A 90.0,90.0 0 0,1 106.0,60.0 Z" fill="#D55E00" class="pulse"><title>rust-oxdock 5.6%</title></path><rect x="224.0" y="168.0" width="14" height="14" fill="#D55E00"/><text x="246.0" y="181.0" font-size="14" fill="#767676">rust-oxdock 5.6%</text></svg>