<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44.0 44.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Status indicators</title><style>.bar{stroke:#fff;stroke-width:2;rx:4}.lbl{fill:#fff;font-size:13px;font-weight:600}.sub{fill:#fff;font-size:11px;opacity:.92}.dim{fill:#333;font-size:12px}.muted{fill:#666;font-size:11px}.pulse{animation:breathe 2.2s ease-in-out infinite}.slow{animation-duration:3.4s}@keyframes breathe{0%,100%{opacity:.95}50%{opacity:.62}}@media (prefers-reduced-motion:reduce){.pulse{animation:none}}</style><circle cx="22.0" cy="22.0" r="8.0" fill="none " stroke="#009E73" stroke-width="2" class="pulse"><title>heating 3.00 3.00</title></circle><circle cx="22.0" cy="22.0" r="8.0" fill="#009E73" opacity="0.73"><title>heating 3.00 3.00</title></circle></svg>