<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44.0 44.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Status indicators</title><style>.ring{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion:reduce){.ring{animation:none}}</style><circle cx="22.0" cy="22.0" r="8.0" fill="none " stroke="#56B4E9" stroke-width="2" class="ring " style="animation-duration:2.3s"><title>steady 1.00 1.00</title></circle><circle cx="22.0" cy="22.0" r="8.0" fill="#56B4E9" opacity="0.54"><title>steady 1.00 1.00</title></circle></svg>