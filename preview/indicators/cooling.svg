<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44.0 44.0" role="img" font-family="Helvetica, Arial, sans-serif"><title>Status indicators</title><style>.bar{stroke:#fff;stroke-width:2;rx:4}.lbl{fill:#fff;font-size:13px;font-weight:600}.sub{fill:#fff;font-size:11px;opacity:.92}.dim{fill:#333;font-size:12px}.muted{fill:#666;font-size:11px}.pulse{animation:breathe 2.2s ease-in-out infinite}.slow{animation-duration:3.4s}@keyframes breathe{0%,100%{opacity:.95}50%{opacity:.62}}.tour-cap{opacity:0;animation:tour-cap ease-in-out infinite}@keyframes tour-cap{0%{opacity:0}2%{opacity:1}10.5%{opacity:1}12.5%{opacity:0}100%{opacity:0}}.acc-s{transform-box:fill-box;transform-origin:left center}@media (prefers-reduced-motion:reduce){.pulse,.tour-cap,.flame-svg .acc-t,.flame-svg .acc-s{animation:none}}</style><circle cx="22.0" cy="22.0" r="8.0" fill="none " stroke="#E69F00" stroke-width="2"><title>cooling 0.25 0.25</title></circle><circle cx="22.0" cy="22.0" r="8.0" fill="#E69F00" opacity="0.47"><title>cooling 0.25 0.25</title></circle></svg>